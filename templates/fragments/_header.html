<header>
  <div class="header-content">
    <a href="{% url 'core:home' %}"><span class="header-titulo"><strong>bibliot.com.br</strong></span></a>

    <div class="search-area">
      <form action="#" method="get" class="form-search">
        <input type="text" aria-label="Buscar livro" name="search-box" id="search-box" placeholder="Seu próximo universo está aqui" maxlength="180" />
        <button type="submit" aria-label="Buscar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
          </svg>
        </button>
      </form>
    </div>

    <div class="user-actions">
      <ul>
        <li>
          <a href="#" aria-label="Lista de desejos">
            <div class="action">
              <div class="itens">
                  <span class="total wishlist">0</span>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <path d="M241 87.1l15 20.7 15-20.7C296 52.5 336.2 32 378.9 32 452.4 32 512 91.6 512 165.1l0 2.6c0 112.2-139.9 242.5-212.9 298.2-12.4 9.4-27.6 14.1-43.1 14.1s-30.8-4.6-43.1-14.1C139.9 410.2 0 279.9 0 167.7l0-2.6C0 91.6 59.6 32 133.1 32 175.8 32 216 52.5 241 87.1z" />
              </svg>
            </div>
          </a>
        </li>
        <li>
          <a href="{% url 'carrinho:carrinho' %}" aria-label="carrinho">
            <div class="action">
              <div class="itens">
                  <span class="carrinho">{{ quantidade_carrinho }}</span>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512">
                <!-- !Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc. -->
                <path d="M24-16C10.7-16 0-5.3 0 8S10.7 32 24 32l45.3 0c3.9 0 7.2 2.8 7.9 6.6l52.1 286.3c6.2 34.2 36 59.1 70.8 59.1L456 384c13.3 0 24-10.7 24-24s-10.7-24-24-24l-255.9 0c-11.6 0-21.5-8.3-23.6-19.7l-5.1-28.3 303.6 0c30.8 0 57.2-21.9 62.9-52.2L568.9 69.9C572.6 50.2 557.5 32 537.4 32l-412.7 0-.4-2c-4.8-26.6-28-46-55.1-46L24-16zM208 512a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm224 0a48 48 0 1 0 0-96 48 48 0 1 0 0 96z" />
              </svg>
            </div>
          </a>
        </li>

        {% if request.user.is_authenticated %}
          <li class="user-menu">
            <div class="user-profile">
              <div class="user-foto">
                {% if request.user.foto %}
                  <img src="{{ request.user.foto.url }}" alt="Foto de perfil" class="profile-img" />
                {% else %}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z" />
                  </svg>
                {% endif %}
              </div>
              <span class="username">{{ request.user.nome }}</span>
            </div>
            <div class="auth-actions">
              <ul>
                <li>
                  <a href="{% url 'accounts:profile' %}">Ver Perfil</a>
                </li>
                <li>
                  <form action="{% url 'accounts:logout' %}" method="post" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-button" aria-label="Fazer logout">Sair</button>
                  </form>
                </li>
              </ul>
            </div>
          </li>
        {% else %}
          <li class="user-menu">
            <div class="user-profile">
              <div class="user-foto">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                  <path d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z" />
                </svg>
              </div>
            </div>

            <div class="auth-actions">
              <ul>
                <li>
                  <a href="{% url 'accounts:login' %}">Entrar</a>
                </li>
                <li>
                  <a href="{% url 'accounts:register' %}">Criar conta</a>
                </li>
              </ul>
            </div>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</header>


<script>
  const quantidadeCarrninho = document.querySelector('.total.carrinho')

</script>
