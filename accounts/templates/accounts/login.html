{% extends 'fragments/_base_form.html' %}


{% block inputs %}
    <label for="email">
        <span>E-mail</span>
        {{ form.username }}
    </label>
    <label for="pass">
        <span>Senha</span>
        {{ form.password }}
    </label>
    <label for="show-pass">
        <span>Exibir Senha</span>
        <input type="checkbox" name="show-pass" id="show-pass" class="auth-checkbox">
    </label>
{% endblock inputs %}



{% block form_buttons %}
    <button type='submit'>Entrar</button>
{% endblock form_buttons %}


{% block form_links %}
    <p>Não tem conta ainda? <a href="{% url 'accounts:register' %}">Cadastre-se!</a></p>
{% endblock form_links %}
    



{% block form_script %}
    <script>
        const senhaInput = document.getElementById("pass");
        const mostrarSenha = document.getElementById("show-pass");

        mostrarSenha.addEventListener("change", () => {
            if (mostrarSenha.checked) {
                senhaInput.type = 'text'
            } else {
                senhaInput.type = 'password'
            }
        })
    </script>
{% endblock form_script %}
